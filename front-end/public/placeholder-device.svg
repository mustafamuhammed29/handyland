<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glassmorphic Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Drop Shadow Filter for Neon elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)" />

  <!-- Technical Grid Pattern Lines (Subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    
    <line x1="0" y1="40" x2="400" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Glowing tech rings behind the device -->
  <circle cx="200" cy="180" r="100" fill="none" stroke="url(#neonGlow)" stroke-width="1.5" stroke-opacity="0.15" />
  <circle cx="200" cy="180" r="80" fill="none" stroke="url(#neonGlow)" stroke-width="1" stroke-dasharray="4 8" stroke-opacity="0.25" />
  
  <!-- Diagonal aesthetic tech lines -->
  <line x1="50" y1="50" x2="100" y2="50" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="50" y1="50" x2="50" y2="100" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" />
  
  <line x1="350" y1="350" x2="300" y2="350" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="350" y1="350" x2="350" y2="300" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Device Outline Mockup (Stylized Phone / Tech item) -->
  <g filter="url(#glow)">
    <!-- Main Outer Body -->
    <rect x="130" y="70" width="140" height="230" rx="24" fill="url(#glassGrad)" stroke="url(#neonGlow)" stroke-width="2.5" />
    
    <!-- Screen Inner Border -->
    <rect x="138" y="78" width="124" height="214" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Dynamic Island / Notch Mockup -->
    <rect x="175" y="88" width="50" height="12" rx="6" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="none" />
    <circle cx="185" cy="94" r="2.5" fill="#1e293b" />
    <circle cx="215" cy="94" r="1.5" fill="#475569" />

    <!-- Technical geometric internal layout -->
    <path d="M 138,150 Q 200,180 262,150" fill="none" stroke="url(#neonGlow)" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="200" cy="180" r="15" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="200" cy="180" r="6" fill="url(#neonGlow)" stroke-width="0" filter="url(#glow)" />
  </g>

  <!-- Sleek Text Branding -->
  <text x="200" y="340" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="4" text-anchor="middle" opacity="0.9">HANDYLAND</text>
  <text x="200" y="362" fill="url(#neonGlow)" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle" opacity="0.8">PREMIUM QUALITY</text>

</svg>
