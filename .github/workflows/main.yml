name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          front-end/package-lock.json
          backend/admin/package-lock.json

    # ── Backend Checks ─────────────────────────────────────────
    - name: Install Backend Dependencies
      run: npm ci
      working-directory: ./backend

    - name: Lint Backend Code
      run: npm run lint
      working-directory: ./backend

    - name: Run Backend Test Suite & Migration Validation
      run: npm test
      working-directory: ./backend
      env:
        NODE_ENV: test
        JWT_SECRET: test_jwt_secret_for_ci_pipeline_32bytes_long
        SESSION_SECRET: test_session_secret_for_ci_32bytes_long
        ADMIN_JWT_SECRET: test_admin_jwt_secret_for_ci_pipeline

    # ── Frontend Checks ────────────────────────────────────────
    - name: Install Frontend Dependencies
      run: npm ci --legacy-peer-deps
      working-directory: ./front-end

    - name: Typecheck & Build Frontend (Customer Portal)
      run: npm run build
      working-directory: ./front-end

    # ── Admin Panel Checks ─────────────────────────────────────
    - name: Install Admin Panel Dependencies
      run: npm ci
      working-directory: ./backend/admin

    - name: Typecheck & Build Admin Panel
      run: npm run build
      working-directory: ./backend/admin

  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            front-end/package-lock.json
            backend/admin/package-lock.json
            e2e-tests/package-lock.json
      
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix front-end
          npm ci --prefix backend/admin
          npm ci --prefix e2e-tests
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e-tests
      
      - name: Start backend
        run: npm start &
        working-directory: backend
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
      
      - name: Start frontend
        run: npm run dev &
        working-directory: front-end
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      
      - name: Start admin
        run: npm run dev &
        working-directory: backend/admin
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      
      - name: Wait for services
        run: sleep 30
      
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e-tests
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 30

  deploy:
    name: Deploy to Production / Staging
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Trigger Webhook Deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret not configured. Skipping automated deploy trigger."
          else
            curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          fi
